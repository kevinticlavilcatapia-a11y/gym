<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FitTracker App</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
        document.documentElement.classList.add('dark');
        localStorage.setItem('fittracker-theme', 'dark');
    </script>
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }

        @keyframes slideRight { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .animate-slide-right { animation: slideRight 0.3s ease-out; }

        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-900 font-sans text-slate-200 md:max-w-md md:mx-auto md:shadow-2xl md:min-h-screen relative flex flex-col h-screen overflow-hidden">

    <div id="loading-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 transition-opacity duration-500">
        <div class="flex flex-col items-center">
            <div class="w-10 h-10 border-4 border-blue-900 border-t-blue-500 rounded-full animate-spin mb-4"></div>
            <p id="loading-text" class="text-slate-400 text-sm font-medium animate-pulse">Iniciando sistema...</p>
        </div>
    </div>

    <div id="video-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/90 backdrop-blur-sm animate-fade-in"></div>
    <div id="floating-timer" class="fixed bottom-24 right-4 z-40 hidden animate-slide-up"></div>

    <main id="app-content" class="flex-1 overflow-hidden relative flex flex-col opacity-0 transition-opacity duration-500">
    </main>

    <nav id="bottom-nav" class="flex-none bg-slate-900 border-t border-slate-800 py-3 px-2 flex justify-between items-center z-40 safe-area-bottom shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.3)] hidden">
        <button onclick="window.appRouter('inicio')" id="nav-inicio" class="flex-1 flex flex-col items-center gap-1 transition-colors text-blue-500"></button>
        <button onclick="window.appRouter('rutinas-list')" id="nav-rutinas" class="flex-1 flex flex-col items-center gap-1 transition-colors text-slate-500 hover:text-slate-300"></button>
        <button onclick="window.appRouter('nutricion-list')" id="nav-nutricion" class="flex-1 flex flex-col items-center gap-1 transition-colors text-slate-500 hover:text-slate-300"></button>
        <button onclick="window.appRouter('perfil')" id="nav-perfil" class="flex-1 flex flex-col items-center gap-1 transition-colors text-slate-500 hover:text-slate-300"></button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, updatePassword, deleteUser } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7HmJ6p_xv8_o3dznCKjRSMUL3x3mptVY",
            authDomain: "fittracker-app-d6b45.firebaseapp.com",
            projectId: "fittracker-app-d6b45",
            messagingSenderId: "816111516880",
            appId: "1:816111516880:web:f77c9afedbf715f9cf32d5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const appId = 'fittracker-v4'; 
        const DUMMY_DOMAIN = "@fittracker.app"; 
        
        let currentUser = null;
        let usersUnsubscribe = null; 

        const CLOUDINARY_CLOUD_NAME = "djglfojvt"; 
        const CLOUDINARY_UPLOAD_PRESET = "fittracker_videos"; 

        const DAYS = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
        const getTodayName = () => { const jsDay = new Date().getDay(); return jsDay === 0 ? 'Domingo' : DAYS[jsDay - 1]; };

        const INITIAL_ROUTINE = { id: 'rutina-01', name: 'Mi Primera Rutina', description: 'Rutina base.', schedule: { Lunes: { focus: 'Pecho', exercises: [], isRest: false }, Martes: { focus: '', exercises: [], isRest: true }, Miércoles: { focus: '', exercises: [], isRest: true }, Jueves: { focus: '', exercises: [], isRest: true }, Viernes: { focus: '', exercises: [], isRest: true }, Sábado: { focus: '', exercises: [], isRest: true }, Domingo: { focus: '', exercises: [], isRest: true } } };
        const INITIAL_NUTRITION = { id: 'nutri-01', name: 'Plan Base', description: 'Plan alimenticio inicial.', schedule: { Lunes: { meals: [] }, Martes: { meals: [] }, Miércoles: { meals: [] }, Jueves: { meals: [] }, Viernes: { meals: [] }, Sábado: { meals: [] }, Domingo: { meals: [] } } };

        const state = {
            currentView: 'login', 
            selectedDay: getTodayName(), 
            userProfile: null, 
            profileLoadedOnce: false,
            
            allUsers: [], 
            isLoadingUsers: false,
            editingUserId: null, 

            myClients: [], 
            isLoadingClients: false,

            isEditingProfile: false,
            isUploadingPhoto: false,
            isRegistering: false,
            
            routines: [], 
            activeRoutineId: null, 
            editingRoutineId: null, 
            nutritionPlans: [],
            activeNutritionId: null, 
            editingNutritionId: null,

            workoutLogs: {}, isRoutineActive: true, expandedExerciseId: null,
            timer: { seconds: 0, running: false, interval: null },
            modal: { open: false, mode: 'view', exercise: null }
        };

        function getActiveRoutine() { return (state.routines && state.routines.length > 0) ? (state.routines.find(r => r && r.id === state.activeRoutineId) || state.routines[0]) : null; }
        function getEditingRoutine() { return (state.routines && state.routines.length > 0) ? (state.routines.find(r => r && r.id === state.editingRoutineId) || state.routines[0]) : null; }
        function getActiveNutrition() { return (state.nutritionPlans && state.nutritionPlans.length > 0) ? (state.nutritionPlans.find(n => n && n.id === state.activeNutritionId) || state.nutritionPlans[0]) : null; }
        function getEditingNutrition() { return (state.nutritionPlans && state.nutritionPlans.length > 0) ? (state.nutritionPlans.find(n => n && n.id === state.editingNutritionId) || state.nutritionPlans[0]) : null; }
        function debounce(func, wait) { let timeout; return function(...args) { clearTimeout(timeout); timeout = setTimeout(() => func.apply(this, args), wait); }; }

        function canEdit() { return state.userProfile && (state.userProfile.rol === 'admin' || state.userProfile.rol === 'entrenador'); }
        function isAdmin() { return state.userProfile && state.userProfile.rol === 'admin'; }

        window.isSubscriptionExpired = () => {
            if (!state.userProfile || state.userProfile.rol !== 'cliente') return false; 
            if (!state.userProfile.subscriptionEnd) return true; 
            return new Date(state.userProfile.subscriptionEnd) < new Date();
        };

        window.getRemainingDays = () => {
            if (!state.userProfile || !state.userProfile.subscriptionEnd) return 0;
            const end = new Date(state.userProfile.subscriptionEnd);
            const diff = end - new Date();
            return diff > 0 ? Math.ceil(diff / (1000 * 60 * 60 * 24)) : 0;
        };

        window.updateClientSubscription = async (clientId) => {
            const months = parseInt(document.getElementById(`select-sub-${clientId}`).value);
            if(!months) return;
            const btn = document.getElementById(`btn-sub-${clientId}`);
            const originalHtml = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = '<i data-lucide="loader-2" class="w-3 h-3 animate-spin"></i>'; lucide.createIcons();
            try {
                const now = new Date();
                const newDate = new Date(now.setMonth(now.getMonth() + months));
                await setDoc(doc(db, 'artifacts', appId, 'profiles', clientId), { subscriptionEnd: newDate.toISOString() }, { merge: true });
                alert("¡Tiempo de uso actualizado exitosamente!");
                window.loadMyClients();
            } catch(e) {
                alert("Error al actualizar tiempo: " + e.message);
                btn.disabled = false; btn.innerHTML = originalHtml; lucide.createIcons();
            }
        };

        function generarCodigoEntrenador() { return Math.random().toString(36).substring(2, 10).toUpperCase(); }

        const _saveRoutineToFirebase = async () => { if (currentUser && canEdit()) { try { await setDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'data', 'routine_list'), { list: state.routines, activeId: state.activeRoutineId }); } catch (e) {} } };
        const _saveNutritionToFirebase = async () => { if (currentUser && canEdit()) { try { await setDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'data', 'nutrition_list'), { list: state.nutritionPlans, activeId: state.activeNutritionId }); } catch (e) {} } };
        const _saveLogsToFirebase = async () => { if (currentUser) { try { await setDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'data', 'logs'), { logs: state.workoutLogs }); } catch (e) {} } };

        const saveRoutineToFirebaseDebounced = debounce(_saveRoutineToFirebase, 1000);
        const saveNutritionToFirebaseDebounced = debounce(_saveNutritionToFirebase, 1000);
        const saveLogsToFirebaseDebounced = debounce(_saveLogsToFirebase, 1000);

        async function initAuth() {
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    setupDataListeners();
                    setTimeout(revealApp, 2500); 
                } else {
                    currentUser = null;
                    state.userProfile = null;
                    state.profileLoadedOnce = false; 
                    state.allUsers = [];
                    state.myClients = [];
                    if(state.currentView !== 'register') state.currentView = 'login';
                    revealApp();
                }
            });
        }

        window.showRegister = () => { state.currentView = 'register'; renderApp(); updateBottomNav(); };
        window.showLogin = () => { state.currentView = 'login'; renderApp(); updateBottomNav(); };

        window.handleLogin = async (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('login-username').value.trim();
            const pass = document.getElementById('login-password').value;
            const btn = document.getElementById('btn-login');
            const err = document.getElementById('login-error');
            if(!usernameInput) { err.innerText = "Ingresa tu usuario."; err.classList.remove('hidden'); return; }
            btn.disabled = true; btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Ingresando...';
            err.classList.add('hidden'); lucide.createIcons();
            const email = usernameInput.toLowerCase() + DUMMY_DOMAIN;
            const isAdminAttempt = (usernameInput.toLowerCase() === 'admin' && pass === 'Ticlavilc@1');

            try {
                const cred = await signInWithEmailAndPassword(auth, email, pass);
                if (isAdminAttempt) {
                    await setDoc(doc(db, 'artifacts', appId, 'profiles', cred.user.uid), { nombre: 'Administrador', usuario: 'admin', rol: 'admin' }, { merge: true });
                }
            } catch (error) {
                if (isAdminAttempt) {
                    try {
                        const cred = await createUserWithEmailAndPassword(auth, email, pass);
                        await setDoc(doc(db, 'artifacts', appId, 'profiles', cred.user.uid), {
                            nombre: 'Administrador', apellidos: 'Principal', celular: '', usuario: 'admin', rol: 'admin', photoUrl: '', codigoPropio: 'ADMIN123'
                        });
                        return; 
                    } catch (e2) { err.innerText = "Error creando cuenta Admin."; err.classList.remove('hidden'); }
                } else { err.innerText = "Error: Usuario o contraseña incorrectos."; err.classList.remove('hidden'); }
                btn.disabled = false; btn.innerHTML = '<i data-lucide="log-in" class="w-5 h-5"></i> Ingresar'; lucide.createIcons();
            }
        };

        window.handleRegisterSubmit = async (e) => {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const lastName = document.getElementById('reg-lastname').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const userStr = document.getElementById('reg-username').value.trim();
            const pass = document.getElementById('reg-password').value;
            const trainerCode = document.getElementById('reg-trainer-code').value.trim().toUpperCase();
            
            const btn = document.getElementById('btn-register'); const err = document.getElementById('reg-error');
            if(userStr.length < 3) { err.innerText = "El usuario debe tener al menos 3 caracteres."; err.classList.remove('hidden'); return; }
            if(userStr.toLowerCase() === 'admin') { err.innerText = "Usuario no disponible."; err.classList.remove('hidden'); return; }
            if(!trainerCode) { err.innerText = "El Código de Entrenador es obligatorio."; err.classList.remove('hidden'); return; }

            btn.disabled = true; btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Validando...';
            err.classList.add('hidden'); lucide.createIcons();
            const email = userStr.toLowerCase() + DUMMY_DOMAIN;
            state.isRegistering = true; 

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, pass);
                const q = query(collection(db, 'artifacts', appId, 'profiles'), where('codigoPropio', '==', trainerCode));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    await deleteUser(cred.user);
                    throw new Error("CODIGO_INVALIDO");
                }
                
                const trainerDoc = querySnapshot.docs[0];
                const trainerData = trainerDoc.data();
                
                let roleToAssign = 'cliente';
                let profileData = { nombre: name, apellidos: lastName, celular: phone, usuario: userStr.toLowerCase(), photoUrl: '', entrenadorAsignado: trainerDoc.id, subscriptionEnd: null };

                if (trainerData.rol === 'admin') {
                    roleToAssign = 'entrenador';
                    profileData.codigoPropio = generarCodigoEntrenador();
                }

                profileData.rol = roleToAssign;
                await setDoc(doc(db, 'artifacts', appId, 'profiles', cred.user.uid), profileData);
                
            } catch (error) {
                if(error.message === 'CODIGO_INVALIDO') err.innerText = "El código de entrenador no existe o es incorrecto.";
                else if(error.code === 'auth/email-already-in-use') err.innerText = "Este nombre de usuario ya está en uso.";
                else if(error.code === 'auth/weak-password') err.innerText = "La contraseña debe tener al menos 6 caracteres.";
                else err.innerText = "Error al registrar: " + error.message;
                
                err.classList.remove('hidden'); btn.disabled = false; btn.innerHTML = '<i data-lucide="user-plus" class="w-5 h-5"></i> Registrarme'; lucide.createIcons();
            } finally {
                state.isRegistering = false; 
            }
        };

        window.handleLogout = async () => { await signOut(auth); state.currentView = 'login'; renderApp(); updateBottomNav(); };

        function revealApp() {
            const loadingOverlay = document.getElementById('loading-overlay');
            if (loadingOverlay) loadingOverlay.classList.add('hidden');
            document.getElementById('app-content').classList.remove('opacity-0');
            renderApp(); updateBottomNav();
        }

        function setupDataListeners() {
            if (!currentUser) return;
            const profileRef = doc(db, 'artifacts', appId, 'profiles', currentUser.uid);
            const routineRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'data', 'routine_list');
            const logsRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'data', 'logs');
            const nutritionRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'data', 'nutrition_list');

            onSnapshot(profileRef, (snap) => {
                if(snap.exists()) {
                    state.profileLoadedOnce = true; 
                    state.userProfile = snap.data();
                    
                    if (state.currentView === 'login' || state.currentView === 'register') {
                        state.currentView = 'inicio';
                        updateBottomNav();
                    }

                    if(state.userProfile.rol === 'admin') {
                        if(!usersUnsubscribe) {
                            usersUnsubscribe = onSnapshot(collection(db, 'artifacts', appId, 'profiles'), (usersSnap) => {
                                state.allUsers = usersSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                                if(state.currentView === 'admin-usuarios') renderApp();
                            });
                        }
                    } else {
                        if(usersUnsubscribe) { usersUnsubscribe(); usersUnsubscribe = null; }
                        state.allUsers = [];
                    }
                    renderApp(); 
                    revealApp(); 
                } else {
                    if (state.profileLoadedOnce) {
                        alert("Tu cuenta ha sido eliminada o desactivada por el Administrador.");
                        window.handleLogout();
                    }
                }
            });

            onSnapshot(routineRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.data();
                    state.routines = data.list || [];
                    state.activeRoutineId = data.activeId || (state.routines.length > 0 ? state.routines[0].id : null);
                } else {
                    state.routines = [];
                    if(canEdit()) {
                        state.routines = [JSON.parse(JSON.stringify(INITIAL_ROUTINE))];
                        state.activeRoutineId = state.routines[0].id;
                        _saveRoutineToFirebase(); 
                    }
                }
                renderApp();
            });

            onSnapshot(nutritionRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.data();
                    state.nutritionPlans = data.list || [];
                    state.activeNutritionId = data.activeId || (state.nutritionPlans.length > 0 ? state.nutritionPlans[0].id : null);
                } else {
                    state.nutritionPlans = [];
                    if(canEdit()) {
                        state.nutritionPlans = [JSON.parse(JSON.stringify(INITIAL_NUTRITION))];
                        state.activeNutritionId = state.nutritionPlans[0].id;
                        _saveNutritionToFirebase(); 
                    }
                }
                renderApp();
            });

            onSnapshot(logsRef, (logSnap) => {
                if (logSnap.exists()) { state.workoutLogs = logSnap.data().logs || {}; renderApp(); }
            });
        }

        window.loadMyClients = async () => {
            if (!canEdit()) return;
            state.isLoadingClients = true; renderApp();
            try {
                const q = query(collection(db, 'artifacts', appId, 'profiles'), where('entrenadorAsignado', '==', currentUser.uid));
                const snap = await getDocs(q);
                state.myClients = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            } catch (error) { console.error(error); } 
            finally { state.isLoadingClients = false; if(state.currentView === 'mis-clientes') renderApp(); }
        };

        window.assignToClient = async (clientId) => {
            const btn = document.getElementById(`btn-assign-${clientId}`);
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Asignando...';
            btn.disabled = true; lucide.createIcons();

            const routineId = document.getElementById(`select-rutina-${clientId}`).value;
            const nutritionId = document.getElementById(`select-nutricion-${clientId}`).value;
            
            try {
                if (routineId) {
                    const routine = state.routines.find(r => r.id === routineId);
                    if (routine) { await setDoc(doc(db, 'artifacts', appId, 'users', clientId, 'data', 'routine_list'), { list: [routine], activeId: routine.id }); }
                }
                if (nutritionId) {
                    const plan = state.nutritionPlans.find(n => n.id === nutritionId);
                    if (plan) { await setDoc(doc(db, 'artifacts', appId, 'users', clientId, 'data', 'nutrition_list'), { list: [plan], activeId: plan.id }); }
                }
                if(!routineId && !nutritionId) alert("Selecciona al menos una rutina o plan.");
                else alert("¡Planes enviados exitosamente!");
            } catch(e) { alert("Error: " + e.message); } 
            finally { btn.innerHTML = originalHtml; btn.disabled = false; lucide.createIcons(); }
        };

        window.loadUsersForAdmin = async () => {
            if (!isAdmin()) return;
            state.isLoadingUsers = true; renderApp(); 
            try {
                const querySnapshot = await getDocs(collection(db, 'artifacts', appId, 'profiles'));
                state.allUsers = querySnapshot.docs.map(d => ({ id: d.id, ...d.data() }));
            } catch (error) {
                console.error(error); alert("Asegúrate de que las reglas de Firebase Firestore permitan lectura total.");
            } finally {
                state.isLoadingUsers = false;
                if(state.currentView === 'admin-usuarios') renderApp();
            }
        };

        window.toggleEditProfile = () => { state.isEditingProfile = !state.isEditingProfile; renderApp(); };

        window.saveProfileEdit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-save-profile');
            btn.disabled = true; btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Guardando...'; lucide.createIcons();

            const nombre = document.getElementById('edit-my-nombre').value.trim();
            const apellidos = document.getElementById('edit-my-apellidos').value.trim();
            const celular = document.getElementById('edit-my-celular').value.trim();
            const newPassword = document.getElementById('edit-my-password').value; 
            const codeInput = document.getElementById('edit-my-codigo');
            let newCode = codeInput ? codeInput.value.trim().toUpperCase() : null;

            if (newPassword && newPassword.length < 6) {
                alert("Mínimo 6 caracteres."); btn.disabled = false; btn.innerHTML = '<i data-lucide="save" class="w-4 h-4"></i> Guardar Cambios'; lucide.createIcons(); return;
            }

            if (newCode) {
                if (newCode.length < 6 || newCode.length > 12 || !/^[A-Z0-9]+$/.test(newCode)) {
                    alert("Código entre 6 y 12 caracteres alfanuméricos."); btn.disabled = false; btn.innerHTML = '<i data-lucide="save" class="w-4 h-4"></i> Guardar Cambios'; lucide.createIcons(); return;
                }
                if (newCode !== state.userProfile.codigoPropio) {
                    const snap = await getDocs(query(collection(db, 'artifacts', appId, 'profiles'), where('codigoPropio', '==', newCode)));
                    if (!snap.empty) { alert("El código ya existe."); btn.disabled = false; btn.innerHTML = '<i data-lucide="save" class="w-4 h-4"></i> Guardar Cambios'; lucide.createIcons(); return; }
                }
            }

            try {
                if (newPassword) await updatePassword(currentUser, newPassword);
                let updates = { nombre, apellidos, celular };
                if (newCode) updates.codigoPropio = newCode; 
                await setDoc(doc(db, 'artifacts', appId, 'profiles', currentUser.uid), updates, { merge: true });
                state.isEditingProfile = false;
                if (newPassword) alert("Contraseña actualizada.");
                renderApp();
            } catch (error) {
                if (error.code === 'auth/requires-recent-login') alert("Debes cerrar sesión e ingresar nuevamente.");
                else alert("Error: " + error.message);
                btn.disabled = false; btn.innerHTML = '<i data-lucide="save" class="w-4 h-4"></i> Guardar Cambios'; lucide.createIcons();
            }
        };

        window.triggerAvatarUpload = () => { document.getElementById('avatar-input').click(); };
        window.handleAvatarSelect = async (input) => {
            const file = input.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) { alert("Selecciona una imagen válida."); input.value = ''; return; }
            if (file.size > 5 * 1024 * 1024) { alert("Máximo 5MB."); input.value = ''; return; }

            state.isUploadingPhoto = true; renderApp(); 
            const formData = new FormData(); formData.append("file", file); formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET); 

            try {
                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
                if (!response.ok) throw new Error(`Error`);
                const data = await response.json(); const photoUrl = data.secure_url;
                await setDoc(doc(db, 'artifacts', appId, 'profiles', currentUser.uid), { photoUrl }, { merge: true });
            } catch (error) { alert("Error foto. " + error.message); } 
            finally { state.isUploadingPhoto = false; renderApp(); }
        };

        window.startEditUser = (uid) => { state.editingUserId = uid; renderApp(); };
        window.cancelUserEdit = () => { state.editingUserId = null; renderApp(); };
        window.saveUserEdit = async (uid) => {

                    const isActive = state.activeRoutineId === routine.id;
                    const borderClass = isActive ? 'border-blue-500 shadow-md ring-1 ring-blue-500/50' : 'border-slate-700 shadow-sm hover:border-slate-600';
                    const badge = isActive ? '<span class="text-[10px] font-bold bg-blue-900/50 text-blue-400 px-2 py-1 rounded border border-blue-800">Activa</span>' : '';
                    
                    let actionButtons = '';
                    if (canEdit()) {
                        actionButtons = `
                            <button onclick="window.editRoutine('${routine.id}')" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-200 py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-1 transition-colors"><i data-lucide="pencil" class="w-4 h-4"></i> Editar</button>
                            <button onclick="window.viewRoutine('${routine.id}')" class="flex-1 bg-blue-900/30 hover:bg-blue-900/50 text-blue-400 border border-blue-900/50 py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-1 transition-colors"><i data-lucide="eye" class="w-4 h-4"></i> Ver</button>
                        `;
                    } else {
                        actionButtons = `
                            <button onclick="window.viewRoutine('${routine.id}')" class="w-full bg-blue-900/30 hover:bg-blue-900/50 text-blue-400 border border-blue-900/50 py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-1 transition-colors"><i data-lucide="eye" class="w-4 h-4"></i> Ver Detalles</button>
                        `;
                    }

                    return `
                    <div class="bg-slate-800 p-4 rounded-xl transition-all mb-3 border ${borderClass}">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <h3 class="font-bold text-white text-lg leading-tight">${routine.name || 'Sin Nombre'}</h3>
                                <p class="text-[11px] text-slate-400 mt-1">${routine.description || 'Sin descripción'}</p>
                            </div>
                            ${badge}
                        </div>
                        <div class="flex gap-2 mt-4 pt-3 border-t border-slate-700">
                            ${actionButtons}
                        </div>
                    </div>`;
                }).join('');
            }

            const createBtn = canEdit() ? `<button onclick="window.createNewRoutine()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all flex justify-center items-center gap-2 mb-4"><i data-lucide="plus" class="w-5 h-5"></i> Crear Nueva Rutina</button>` : '';

            return `
            <div class="flex flex-col h-full animate-fade-in">
                <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-10 px-5 py-4">
                    <h1 class="text-2xl font-bold text-white mb-1">Tus Rutinas</h1>
                    <p class="text-slate-400 text-sm">Gestiona tus planes de entrenamiento.</p>
                </header>
                <div class="flex-1 overflow-y-auto p-5 pb-24">
                    ${createBtn}
                    <div class="space-y-3">
                        ${listHTML}
                    </div>
                </div>
            </div>`;
        }

        function getNutritionListHTML() {
            let listHTML = '';
            if (!state.nutritionPlans || state.nutritionPlans.length === 0) {
                listHTML = `<div class="text-center py-10 bg-slate-800 rounded-xl border border-slate-700 border-dashed"><i data-lucide="utensils" class="w-10 h-10 mx-auto text-slate-600 mb-3"></i><p class="text-slate-400">No tienes planes nutricionales asignados.</p></div>`;
            } else {
                listHTML = state.nutritionPlans.map(plan => {
                    const isActive = state.activeNutritionId === plan.id;
                    const borderClass = isActive ? 'border-green-500 shadow-md ring-1 ring-green-500/50' : 'border-slate-700 shadow-sm hover:border-slate-600';
                    const badge = isActive ? '<span class="text-[10px] font-bold bg-green-900/50 text-green-400 px-2 py-1 rounded border border-green-800">Activo</span>' : '';
                    
                    let actionButtons = '';
                    if (canEdit()) {
                        actionButtons = `
                            <button onclick="window.editNutrition('${plan.id}')" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-200 py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-1 transition-colors"><i data-lucide="pencil" class="w-4 h-4"></i> Editar</button>
                            <button onclick="window.viewNutrition('${plan.id}')" class="flex-1 bg-green-900/30 hover:bg-green-900/50 text-green-400 border border-green-900/50 py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-1 transition-colors"><i data-lucide="eye" class="w-4 h-4"></i> Ver</button>
                        `;
                    } else {
                        actionButtons = `
                            <button onclick="window.viewNutrition('${plan.id}')" class="w-full bg-green-900/30 hover:bg-green-900/50 text-green-400 border border-green-900/50 py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-1 transition-colors"><i data-lucide="eye" class="w-4 h-4"></i> Ver Detalles</button>
                        `;
                    }

                    return `
                    <div class="bg-slate-800 p-4 rounded-xl transition-all mb-3 border ${borderClass}">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <h3 class="font-bold text-white text-lg leading-tight">${plan.name || 'Sin Nombre'}</h3>
                                <p class="text-[11px] text-slate-400 mt-1">${plan.description || 'Sin descripción'}</p>
                            </div>
                            ${badge}
                        </div>
                        <div class="flex gap-2 mt-4 pt-3 border-t border-slate-700">
                            ${actionButtons}
                        </div>
                    </div>`;
                }).join('');
            }

            const createBtn = canEdit() ? `<button onclick="window.createNewNutrition()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all flex justify-center items-center gap-2 mb-4"><i data-lucide="plus" class="w-5 h-5"></i> Crear Nuevo Plan</button>` : '';

            return `
            <div class="flex flex-col h-full animate-fade-in">
                <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-10 px-5 py-4">
                    <h1 class="text-2xl font-bold text-white mb-1">Nutrición</h1>
                    <p class="text-slate-400 text-sm">Gestiona tus planes de alimentación.</p>
                </header>
                <div class="flex-1 overflow-y-auto p-5 pb-24">
                    ${createBtn}
                    <div class="space-y-3">
                        ${listHTML}
                    </div>
                </div>
            </div>`;
        }

        initAuth();
    </script>
</body>
</html>
