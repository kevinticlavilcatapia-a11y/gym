<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan Workout App</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', // Habilitar modo oscuro por clases
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom Styles -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animaciones */
        .fade-in { animation: fadeIn 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .slide-up { animation: slideUp 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        .slide-in-right { animation: slideInRight 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .scale-in { animation: scaleIn 0.15s ease-out; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideInRight { from { transform: translateX(10px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        html { scroll-behavior: smooth; }
    </style>
</head>
<body>

    <!-- Theme Wrapper: Controla la clase 'dark' -->
    <div id="theme-wrapper" class="dark transition-colors duration-300 bg-slate-50 dark:bg-slate-950 min-h-screen text-slate-900 dark:text-slate-100 pb-32 selection:bg-indigo-500/30">
        
        <!-- App Container -->
        <div id="app" class="max-w-6xl mx-auto p-4 md:p-6 transition-all duration-300"></div>

        <!-- Modal Container -->
        <div id="modal-layer" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/95 backdrop-blur-md transition-opacity duration-300"></div>
    
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Configuración Firebase ---
        const MANUAL_FIREBASE_CONFIG = {
            apiKey: "AIzaSyDqQJTpMGsn6xK87NKGcjof4UcrGCrbRr4",
            authDomain: "titan-workout-f43a3.firebaseapp.com",
            projectId: "titan-workout-f43a3",
            storageBucket: "titan-workout-f43a3.firebasestorage.app",
            messagingSenderId: "809840750571",
            appId: "1:809840750571:web:410ebea582cbf00fa5b3ae"
        };

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : MANUAL_FIREBASE_CONFIG;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'mi-entrenamiento-app';
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- Constantes ---
        const DAYS_OF_WEEK = ["LUNES", "MARTES", "MIÉRCOLES", "JUEVES", "VIERNES", "SÁBADO", "DOMINGO"];
        
        // --- RUTINA INTEGRADA COMPLETA ---
        const INITIAL_ROUTINES = [
            {
                id: 'routine-1',
                name: "Definición y Perder Grasa 5 Días",
                description: "Rutina de alta intensidad enfocada en déficit calórico (Lunes a Viernes).",
                days: {
                    "LUNES": { 
                        category: "PUSH/ARMS", 
                        exercises: [
                            { id: 'l1', name: "Press Inclinado con Mancuernas", reps: "4 x 10 REPS", video: null, history: [] },
                            { id: 'l2', name: "Press Inclinado con Barra", reps: "3 x 10 REPS", video: null, history: [] },
                            { id: 'l3', name: "Elevaciones Laterales con Mancuernas", reps: "4 x 10 REPS", video: null, history: [] },
                            { id: 'l4', name: "Press Plano con Barra", reps: "3 x 10 REPS", video: null, history: [] },
                            { id: 'l5', name: "Curl de Biceps con Mancuernas", reps: "3 x 10 REPS", video: null, history: [] },
                            { id: 'l6', name: "Extension de Triceps con Soga o Barra", reps: "3 x 10 REPS", video: null, history: [] },
                            { id: 'l7', name: "Curl Martillo con Mancuernas", reps: "3 x 10 REPS", video: null, history: [] },
                            { id: 'l8', name: "Elevaciones de Piernas", reps: "3 x 10 REPS", video: null, history: [] }
                        ] 
                    },
                    "MARTES": { 
                        category: "CADERA POSTERIOR", 
                        exercises: [
                            { id: 'm1', name: "Lat Pulldown Abierto", reps: "3 x 10 REPS", video: null, history: [] },
                            { id: 'm2', name: "Remo Barra T Agarre Cerrado", reps: "4 x 10 REPS", video: null, history: [] },
                            { id: 'm3', name: "Remo Unilateral con Mancuerna", reps: "3 x 10 REPS X LADO", video: null, history: [] },
                            { id: 'm4', name: "Reverse Pec Deck", reps: "3 x 10 REPS", video: null, history: [] },
                            { id: 'm5', name: "Leg Curl Sentado", reps: "3 x 10 REPS", video: null, history: [] },
                            { id: 'm6', name: "Peso Muerto Rumano con Barra", reps: "3 x 10 REPS", video: null, history: [] },
                            { id: 'm7', name: "Press de Pantorrillas", reps: "3 x 10 REPS", video: null, history: [] }
                        ] 
                    },
                    "MIÉRCOLES": { 
                        category: "PUSH", 
                        exercises: [
                            { id: 'mi1', name: "Elevaciones Laterales con Mancuernas", reps: "4 x 10 REPS", video: null, history: [] },
                            { id: 'mi2', name: "Press Plano con Barra", reps: "4 x 10 REPS", video: null, history: [] },
                            { id: 'mi3', name: "Press Inclinado con Barra", reps: "3 x 10 REPS", video: null, history: [] },
                            { id: 'mi4', name: "Press de Hombros con Mancuernas", reps: "3 x 10 REPS", video: null, history: [] },
                            { id: 'mi5', name: "Elevaciones Laterales con Mancuernas (Unilateral)", reps: "3 x 10 REPS X LADO", video: null, history: [] },
                            { id: 'mi6', name: "Extension de Triceps con Soga o Barra", reps: "4 x 10 REPS", video: null, history: [] },
                            { id: 'mi7', name: "Crunch Echado", reps: "3 x 10 REPS", video: null, history: [] }
                        ] 
                    },
                    "JUEVES": { 
                        category: "PULL", 
                        exercises: [
                            { id: 'j1', name: "Remo Barra T (Agarre Abierto)", reps: "4 x 10 REPS", video: null, history: [] },
                            { id: 'j2', name: "Kelso Shrugs con Mancuernas", reps: "4 x 10 REPS", video: null, history: [] },
                            { id: 'j3', name: "Lat Pulldown Abierto", reps: "4 x 10 REPS", video: null, history: [] },
                            { id: 'j4', name: "Remo Unilateral con Mancuerna", reps: "3 x 10 REPS X LADO", video: null, history: [] },
                            { id: 'j5', name: "Reverse Pec Deck", reps: "3 x 10 REPS", video: null, history: [] },
                            { id: 'j6', name: "Curl Predicador en Maquina", reps: "3 x 10 REPS", video: null, history: [] },
                            { id: 'j7', name: "Curl Martillo con Mancuernas", reps: "3 x 10 REPS", video: null, history: [] }
                        ] 
                    },
                    "VIERNES": { 
                        category: "PIERNAS", 
                        exercises: [
                            { id: 'v1', name: "Press de Pantorrillas", reps: "3 x 10 REPS", video: null, history: [] },
                            { id: 'v2', name: "Leg Curl Sentado", reps: "3 x 10 REPS", video: null, history: [] },
                            { id: 'v3', name: "Aductor en Maquina", reps: "3 x 10 REPS", video: null, history: [] },
                            { id: 'v4', name: "Leg Extension", reps: "3 x 10 REPS", video: null, history: [] },
                            { id: 'v5', name: "Hack Squat", reps: "3 x 10 REPS", video: null, history: [] },
                            { id: 'v6', name: "Leg Press", reps: "3 x 10 REPS", video: null, history: [] }
                        ] 
                    },
                    "SÁBADO": { category: "DÍA LIBRE", exercises: [] },
                    "DOMINGO": { category: "DÍA LIBRE", exercises: [] }
                }
            }
        ];

        function getCurrentDayName() {
            const dayIndex = new Date().getDay(); 
            const mappedIndex = dayIndex === 0 ? 6 : dayIndex - 1;
            return DAYS_OF_WEEK[mappedIndex];
        }

        // --- Estado Global ---
        const state = {
            user: null,
            routines: [],
            isLoading: true,
            isSaving: false,
            activeRoutineId: null,
            editingRoutineId: null,
            currentView: 'home',
            selectedDay: getCurrentDayName(),
            theme: 'dark', // 'dark' | 'light'
            
            editingExerciseId: null,
            editValues: { name: '', reps: '' },
            isEditingRoutineName: false,
            routineNameEdit: '',
            isEditingDayCategory: false,
            dayCategoryEdit: '',
            
            modalType: null, // 'video', 'history', 'confirm', 'alert'
            modalMessage: '',
            modalAction: null,
            activeVideo: null,
            activeHistoryExerciseId: null,
            isModalOpen: false
        };

        // --- Inicialización ---
        async function initApp() {
            if (initialAuthToken) {
                await signInWithCustomToken(auth, initialAuthToken);
            } else {
                await signInAnonymously(auth);
            }

            onAuthStateChanged(auth, (user) => {
                state.user = user;
                if (user) setupFirestoreListener(user);
                else render();
            });
        }

        function setupFirestoreListener(user) {
            const routinesRef = collection(db, 'artifacts', appId, 'users', user.uid, 'routines');
            onSnapshot(routinesRef, (snapshot) => {
                if (snapshot.empty) {
                    INITIAL_ROUTINES.forEach(r => setDoc(doc(routinesRef, r.id), r));
                } else {
                    const loaded = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    loaded.sort((a, b) => a.id.localeCompare(b.id));
                    state.routines = loaded;
                    
                    if (!state.activeRoutineId && loaded.length > 0) {
                        state.activeRoutineId = loaded[0].id;
                    } else if (state.activeRoutineId && !loaded.find(r => r.id === state.activeRoutineId)) {
                        state.activeRoutineId = loaded.length > 0 ? loaded[0].id : null;
                    }
                    
                    state.isLoading = false;
                    render();
                }
            });
        }

        async function saveRoutine(routine) {
            if (!state.user) return;
            state.isSaving = true;
            renderHeaderOnly();
            try {
                await setDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'routines', routine.id), routine);
            } catch (error) {
                console.error("Error guardando:", error);
            } finally {
                setTimeout(() => {
                    state.isSaving = false;
                    renderHeaderOnly();
                }, 800);
            }
        }

        // --- Acciones ---
        window.actions = {
            toggleTheme: () => {
                state.theme = state.theme === 'dark' ? 'light' : 'dark';
                const wrapper = document.getElementById('theme-wrapper');
                if (state.theme === 'dark') {
                    wrapper.classList.add('dark');
                } else {
                    wrapper.classList.remove('dark');
                }
                render(); // Re-render para actualizar iconos
            },
            setView: (view) => {
                state.currentView = view;
                state.editingRoutineId = null;
                render();
            },
            setDay: (day) => {
                state.selectedDay = day;
                render();
                setTimeout(() => {
                    const el = document.getElementById(`day-${day}`);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }, 50);
            },
            setActiveRoutine: (id) => { state.activeRoutineId = id; render(); },
            startEditRoutine: (id) => {
                const r = state.routines.find(rt => rt.id === id);
                state.editingRoutineId = id;
                state.routineNameEdit = r.name;
                render();
            },
            createRoutine: async () => {
                const newId = `routine-${Date.now()}`;
                const newRoutine = {
                    id: newId,
                    name: "Nueva Rutina Personalizada",
                    description: "Rutina creada recientemente",
                    days: DAYS_OF_WEEK.reduce((acc, day) => ({ ...acc, [day]: { category: "ENFOQUE DEL DÍA", exercises: [] } }), {})
                };
                state.editingRoutineId = newId;
                await saveRoutine(newRoutine);
            },
            
            // --- NUEVO: Función Delete con Modal Personalizado ---
            deleteRoutine: (id) => {
                if (state.routines.length <= 1) {
                    actions.showAlert("No puedes eliminar la última rutina. Debes tener al menos una.");
                    return;
                }
                actions.showConfirm("¿Estás seguro de eliminar esta rutina permanentemente?", async () => {
                    if (state.editingRoutineId === id) state.editingRoutineId = null;
                    await deleteDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'routines', id));
                });
            },

            addNewExercise: async () => {
                const r = getDisplayRoutine();
                if (!r) return;
                const newEx = { id: Date.now().toString(), name: "Nuevo Ejercicio", reps: "3 x 10 REPS", video: null, history: [] };
                r.days[state.selectedDay].exercises.push(newEx);
                state.editingExerciseId = newEx.id;
                state.editValues = { name: newEx.name, reps: newEx.reps };
                await saveRoutine(r);
            },
            
            // --- NUEVO: Función Delete Exercise con Modal ---
            deleteExercise: (exId) => {
                actions.showConfirm("¿Eliminar este ejercicio?", async () => {
                    const r = getDisplayRoutine();
                    r.days[state.selectedDay].exercises = r.days[state.selectedDay].exercises.filter(e => e.id !== exId);
                    await saveRoutine(r);
                });
            },

            startEditExercise: (exId, name, reps) => {
                state.editingExerciseId = exId;
                state.editValues = { name, reps };
                render();
            },
            cancelEditExercise: () => { state.editingExerciseId = null; render(); },
            saveExercise: async () => {
                const r = getDisplayRoutine();
                const ex = r.days[state.selectedDay].exercises.find(e => e.id === state.editingExerciseId);
                if (ex) {
                    ex.name = state.editValues.name;
                    ex.reps = state.editValues.reps;
                    await saveRoutine(r);
                }
                state.editingExerciseId = null;
                render();
            },
            handleInputChange: (field, value) => { state.editValues[field] = value; },
            handleRoutineNameChange: (value) => { state.routineNameEdit = value; },
            handleDayCategoryChange: (value) => { state.dayCategoryEdit = value; },
            
            saveSet: async (exId) => {
                const r = getDisplayRoutine();
                const ex = r.days[state.selectedDay].exercises.find(e => e.id === exId);
                const w = document.getElementById(`weight-${exId}`).value;
                const rp = document.getElementById(`reps-${exId}`).value;
                if (!w || !rp) return actions.showAlert("Ingresa peso y repeticiones"); // Usar alerta custom
                if (!ex.history) ex.history = [];
                ex.history.push({ date: new Date().toISOString(), weight: w, reps: rp });
                await saveRoutine(r);
            },
            openHistory: (exId) => {
                state.activeHistoryExerciseId = exId;
                state.modalType = 'history';
                state.isModalOpen = true;
                renderModal();
            },
            toggleRoutineNameEdit: (isEditing) => {
                state.isEditingRoutineName = isEditing;
                if (isEditing) state.routineNameEdit = getDisplayRoutine().name;
                render();
            },
            saveRoutineName: async () => {
                const r = getDisplayRoutine();
                r.name = state.routineNameEdit;
                await saveRoutine(r);
                state.isEditingRoutineName = false;
                render();
            },
            toggleDayCategoryEdit: (isEditing) => {
                state.isEditingDayCategory = isEditing;
                if (isEditing) state.dayCategoryEdit = getDisplayRoutine().days[state.selectedDay].category;
                render();
            },
            saveDayCategory: async () => {
                const r = getDisplayRoutine();
                r.days[state.selectedDay].category = state.dayCategoryEdit;
                await saveRoutine(r);
                state.isEditingDayCategory = false;
                render();
            },
            openVideo: (url) => {
                state.activeVideo = url;
                state.modalType = 'video';
                state.isModalOpen = true;
                renderModal();
            },
            
            // --- NUEVO: Control de Modales ---
            showAlert: (msg) => {
                state.modalType = 'alert';
                state.modalMessage = msg;
                state.isModalOpen = true;
                renderModal();
            },
            showConfirm: (msg, action) => {
                state.modalType = 'confirm';
                state.modalMessage = msg;
                state.modalAction = action;
                state.isModalOpen = true;
                renderModal();
            },
            confirmAction: async () => {
                if (state.modalAction) await state.modalAction();
                actions.closeModal();
            },
            closeModal: () => {
                state.isModalOpen = false;
                state.activeVideo = null;
                state.activeHistoryExerciseId = null;
                state.modalType = null;
                state.modalAction = null;
                renderModal();
            },
            
            handleFileUpload: async (input, exId) => {
                const file = input.files[0];
                if (file) {
                    const url = URL.createObjectURL(file);
                    const r = getDisplayRoutine();
                    const ex = r.days[state.selectedDay].exercises.find(e => e.id === exId);
                    ex.video = url;
                    await saveRoutine(r);
                }
            },
            deleteVideo: async (exId) => {
                const r = getDisplayRoutine();
                const ex = r.days[state.selectedDay].exercises.find(e => e.id === exId);
                ex.video = null;
                await saveRoutine(r);
            }
        };

        function getDisplayRoutine() {
            if (state.currentView === 'home') return state.routines.find(r => r.id === state.activeRoutineId);
            return state.editingRoutineId ? state.routines.find(r => r.id === state.editingRoutineId) : null;
        }

        // --- Componentes ---

        function Header() {
            const displayRoutine = getDisplayRoutine();
            const title = state.currentView === 'home' ? 'Titan Inicio' : 'Gestor Rutinas';
            const subTitle = state.isLoading ? 'Conectando...' : (
                state.currentView === 'home' ? (displayRoutine?.name || 'Sin Rutina') 
                : (state.editingRoutineId ? 'Modo Edición' : 'Seleccionar')
            );
            const iconColorClass = state.currentView === 'home' ? 'bg-indigo-600' : 'bg-emerald-600';
            const textColorClass = state.currentView === 'home' ? 'text-indigo-600 dark:text-indigo-400' : 'text-emerald-600 dark:text-emerald-400';
            
            let statusIcon = 'cloud';
            let statusClass = '';
            
            if (state.isSaving) {
                statusIcon = 'refresh-cw';
                statusClass = 'animate-spin';
            } else if (state.user) {
                statusIcon = 'cloud-lightning';
            }

            return `
                <div class="flex items-center justify-between w-full md:w-auto">
                    <div class="flex items-center gap-3">
                        <div class="${iconColorClass} p-2 rounded-xl shadow-lg transition-colors duration-500 scale-in">
                            <i data-lucide="${statusIcon}" class="w-6 h-6 text-white ${statusClass}"></i>
                        </div>
                        <div class="min-w-0 slide-in-right">
                            <div class="flex items-center gap-2">
                                <h1 class="text-xl md:text-2xl font-black tracking-tighter uppercase italic truncate">${title}</h1>
                                ${state.isSaving ? `<span class="text-[10px] bg-emerald-500/20 text-emerald-500 dark:text-emerald-400 px-2 py-0.5 rounded-full font-bold uppercase tracking-wider animate-pulse">Guardando...</span>` : ''}
                            </div>
                            <span class="text-[10px] md:text-xs font-bold uppercase tracking-widest block truncate ${textColorClass}">
                                ${subTitle}
                            </span>
                        </div>
                    </div>
                    <button onclick="actions.toggleTheme()" class="md:ml-4 p-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-white transition-all shadow-sm">
                        <i data-lucide="${state.theme === 'dark' ? 'sun' : 'moon'}" class="w-5 h-5"></i>
                    </button>
                </div>
            `;
        }

        function BottomNav() {
            const btnClass = (isActive, color) => `
                flex items-center gap-2 px-5 py-3 md:px-6 md:py-3 rounded-xl font-bold transition-all duration-300 active:scale-95
                ${isActive ? `bg-${color}-600 text-white shadow-lg shadow-${color}-500/30` : 'text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800'}
            `;
            return `
                <div class="fixed bottom-6 left-0 right-0 px-4 flex justify-center z-40 pointer-events-none">
                    <div class="bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border border-slate-200 dark:border-slate-700 p-2 rounded-2xl flex gap-2 shadow-2xl shadow-slate-200/50 dark:shadow-black/50 pointer-events-auto slide-up">
                        <button onclick="actions.setView('home')" class="${btnClass(state.currentView === 'home', 'indigo')}">
                            <i data-lucide="home" class="w-5 h-5"></i> <span class="text-sm">Inicio</span>
                        </button>
                        <button onclick="actions.setView('routines')" class="${btnClass(state.currentView === 'routines', 'emerald')}">
                            <i data-lucide="layout" class="w-5 h-5"></i> <span class="text-sm">Rutinas</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function RoutineList() {
            return `
                <div class="space-y-6 fade-in">
                    <div class="grid grid-cols-1 gap-4">
                        ${state.routines.map(r => {
                            const isActive = state.activeRoutineId === r.id;
                            return `
                                <div onclick="actions.startEditRoutine('${r.id}')" class="relative p-5 md:p-6 rounded-3xl border-2 cursor-pointer transition-all duration-300 active:scale-[0.98] ${isActive ? 'bg-gradient-to-br from-indigo-500 to-indigo-700 dark:from-indigo-900/50 dark:to-slate-900 border-indigo-500 shadow-xl' : 'bg-white dark:bg-slate-900/50 border-slate-200 dark:border-slate-800 hover:border-emerald-500/50'}">
                                    <div class="flex flex-col gap-2 mb-4">
                                        <div class="flex justify-between items-start gap-4">
                                            <h3 class="text-lg md:text-xl font-bold leading-tight ${isActive ? 'text-white' : 'text-slate-900 dark:text-white'}">${r.name}</h3>
                                            ${isActive ? `<span class="shrink-0 bg-white/20 text-white text-[10px] font-bold px-2 py-1 rounded-full flex items-center gap-1 backdrop-blur-sm scale-in"><i data-lucide="check-circle-2" class="w-3 h-3"></i> ACTIVA</span>` : ''}
                                        </div>
                                        <p class="text-sm line-clamp-2 ${isActive ? 'text-indigo-100' : 'text-slate-500 dark:text-slate-400'}">${r.description}</p>
                                    </div>
                                    <div class="flex gap-3 mt-4 relative z-10">
                                        <button onclick="event.stopPropagation(); actions.setActiveRoutine('${r.id}')" class="flex-1 py-3 px-4 rounded-xl text-xs md:text-sm font-bold transition-all duration-200 active:scale-95 ${isActive ? 'bg-white/10 text-white cursor-default backdrop-blur-md' : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg'}">${isActive ? 'En uso' : 'Usar Rutina'}</button>
                                        <button onclick="event.stopPropagation(); actions.deleteRoutine('${r.id}')" class="p-3 rounded-xl transition-colors border active:scale-95 transition-transform ${isActive ? 'bg-white/10 text-white border-white/10 hover:bg-red-500/20' : 'bg-slate-100 dark:bg-slate-800 text-slate-400 hover:bg-red-500/20 hover:text-red-400 border-slate-200 dark:border-slate-700'}"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                        <button onclick="actions.createRoutine()" class="p-6 border-2 border-dashed border-slate-300 dark:border-slate-800 rounded-3xl text-slate-500 hover:text-emerald-500 hover:border-emerald-500/50 hover:bg-emerald-50 dark:hover:bg-emerald-500/5 transition-all flex flex-col items-center justify-center gap-2 touch-manipulation active:scale-[0.98]">
                            <i data-lucide="plus-circle" class="w-8 h-8 opacity-50"></i><span class="font-bold uppercase tracking-widest text-sm">Crear Nueva Rutina</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function RoutineDetail() {
            const displayRoutine = getDisplayRoutine();
            if (!displayRoutine) return `<div class="text-center p-10 text-slate-500 fade-in">No hay rutina seleccionada.</div>`;
            const isEditor = state.currentView === 'routines' && state.editingRoutineId;
            const currentDayData = displayRoutine.days[state.selectedDay];
            const activeColor = isEditor ? 'emerald' : 'indigo';
            const activeBg = isEditor ? 'bg-emerald-600' : 'bg-indigo-600';
            const activeBorder = isEditor ? 'border-emerald-500' : 'border-indigo-500';
            const indicatorColor = isEditor ? 'bg-emerald-500/50' : 'bg-indigo-500/50';

            const daySelector = `<div class="relative group -mx-4 px-4 md:mx-0 md:px-0 mb-6"><div class="flex overflow-x-auto pb-4 gap-2 no-scrollbar px-1 snap-x scroll-smooth">${DAYS_OF_WEEK.map(day => {
                const isActive = state.selectedDay === day;
                const hasEx = displayRoutine.days[day].exercises.length > 0;
                return `<button id="day-${day}" onclick="actions.setDay('${day}')" class="flex-shrink-0 snap-center min-w-[85px] md:min-w-[120px] flex flex-col items-center p-2 md:p-3 rounded-2xl transition-all duration-300 border-2 active:scale-95 ${isActive ? `${activeBg} ${activeBorder} text-white shadow-xl -translate-y-1` : 'bg-white dark:bg-slate-900/50 border-slate-200 dark:border-slate-800 text-slate-400 hover:border-slate-300 dark:hover:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-900'}"><span class="text-[9px] md:text-[10px] uppercase font-bold tracking-widest mb-1 ${isActive ? 'text-white/80' : 'text-slate-500'}">${day.slice(0, 3)}</span><div class="h-1.5 w-8 rounded-full mb-1 transition-colors ${isActive ? 'bg-white' : (hasEx ? indicatorColor : 'bg-slate-300 dark:bg-slate-700')}"></div></button>`;
            }).join('')}</div></div>`;

            const dayHeader = `<div class="bg-white dark:bg-slate-900/30 border border-slate-200 dark:border-slate-800 p-5 md:p-8 rounded-[2rem] relative overflow-hidden mb-6 slide-in-right shadow-sm dark:shadow-none transition-colors duration-300"><div class="absolute top-0 right-0 p-8 opacity-5 pointer-events-none"><i data-lucide="dumbbell" class="w-24 h-24 md:w-32 md:h-32 text-slate-900 dark:text-white"></i></div><div class="relative z-10"><div class="flex items-center gap-2 mb-2"><span class="${isEditor ? 'bg-emerald-100 text-emerald-600 dark:bg-emerald-500/20 dark:text-emerald-400' : 'bg-indigo-100 text-indigo-600 dark:bg-indigo-500/20 dark:text-indigo-400'} text-[9px] md:text-[10px] font-black uppercase tracking-[0.2em] px-2 py-1 rounded">Enfoque del Día</span></div>${isEditor && state.isEditingDayCategory ? `<div class="flex gap-2 w-full mt-2"><input type="text" value="${state.dayCategoryEdit}" oninput="actions.handleDayCategoryChange(this.value)" class="flex-1 bg-slate-50 dark:bg-slate-950 border border-emerald-500 rounded-xl px-4 py-2 text-xl md:text-2xl font-black text-slate-900 dark:text-white italic uppercase focus:outline-none w-full" autofocus /><button onclick="actions.saveDayCategory()" class="px-4 bg-emerald-600 rounded-xl text-white active:scale-95 transition-transform"><i data-lucide="save" class="w-5 h-5"></i></button></div>` : `<div class="flex items-center flex-wrap gap-2"><h2 class="text-3xl md:text-5xl font-black text-slate-900 dark:text-white italic tracking-tighter uppercase leading-none break-words">${currentDayData.category}</h2>${isEditor ? `<button onclick="actions.toggleDayCategoryEdit(true)" class="p-2 bg-slate-100 dark:bg-slate-800 rounded-full text-slate-400 hover:text-white hover:bg-emerald-600 transition-all"><i data-lucide="edit-2" class="w-4 h-4"></i></button>` : ''}</div>`}</div></div>`;

            const exercisesList = currentDayData.exercises.length === 0 ? 
                `<div class="flex flex-col items-center justify-center py-16 md:py-20 bg-slate-100 dark:bg-slate-900/20 border-2 border-dashed border-slate-300 dark:border-slate-800 rounded-[2.5rem] fade-in"><div class="bg-white dark:bg-slate-800 p-5 md:p-6 rounded-full mb-4 shadow-sm"><i data-lucide="coffee" class="w-10 h-10 md:w-12 md:h-12 text-slate-400"></i></div><h3 class="text-xl md:text-2xl font-bold text-slate-400 dark:text-slate-300 mb-2">Día de Recuperación</h3>${isEditor ? `<button onclick="actions.addNewExercise()" class="mt-4 flex items-center gap-2 px-6 py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold transition-all text-sm md:text-base active:scale-95"><i data-lucide="plus-circle" class="w-5 h-5"></i> Agregar Ejercicio</button>` : ''}</div>` 
                : `<div class="grid gap-3 md:gap-4 fade-in">${currentDayData.exercises.map((ex, idx) => {
                    const isEditingEx = isEditor && state.editingExerciseId === ex.id;
                    const hasHistory = ex.history && ex.history.length > 0;
                    const lastLog = hasHistory ? ex.history[ex.history.length - 1] : null;
                    return `<div class="group relative bg-white dark:bg-slate-900/40 border ${!isEditor ? 'border-slate-200 dark:border-slate-800/60' : 'border-slate-200 dark:border-slate-800 hover:border-emerald-500/30'} rounded-3xl overflow-hidden transition-all duration-300 shadow-sm dark:shadow-none"><div class="p-4 md:p-5 flex flex-col md:flex-row md:items-center justify-between gap-4"><div class="flex items-start gap-3 md:gap-4 flex-1"><span class="flex-shrink-0 flex items-center justify-center w-7 h-7 md:w-8 md:h-8 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 font-bold text-xs md:text-sm mt-1">${idx + 1}</span><div class="flex-1 min-w-0">${isEditingEx ? `<div class="space-y-3"><input type="text" value="${state.editValues.name}" oninput="actions.handleInputChange('name', this.value)" class="w-full bg-slate-50 dark:bg-slate-950 border border-emerald-500 rounded-xl px-3 py-2 md:px-4 md:py-3 text-slate-900 dark:text-white focus:outline-none text-sm md:text-base" /><input type="text" value="${state.editValues.reps}" oninput="actions.handleInputChange('reps', this.value)" class="w-full bg-slate-50 dark:bg-slate-950 border border-emerald-500 rounded-xl px-3 py-2 md:px-4 md:py-3 text-emerald-600 dark:text-emerald-400 text-sm font-mono focus:outline-none" /></div>` : `<div class="pr-2"><h3 class="text-base md:text-xl font-bold text-slate-900 dark:text-slate-100 mb-1 group-hover:text-indigo-600 dark:group-hover:text-white transition-colors tracking-tight leading-snug break-words">${ex.name}</h3><span class="${!isEditor ? 'text-indigo-600 bg-indigo-100 dark:text-indigo-400 dark:bg-indigo-500/10' : 'text-emerald-600 bg-emerald-100 dark:text-emerald-400 dark:bg-emerald-500/10'} font-mono text-[10px] md:text-xs font-bold tracking-widest px-2 py-1 md:px-3 rounded-lg">${ex.reps}</span>${!isEditor && lastLog ? `<div class="mt-2 text-xs text-slate-500 flex items-center gap-1"><i data-lucide="history" class="w-3 h-3"></i> Último: <span class="text-emerald-500 font-bold">${lastLog.weight}kg x ${lastLog.reps}</span></div>` : ''}</div>`}</div></div><div class="flex items-center gap-2 self-end md:self-center mt-2 md:mt-0">${!isEditor ? `<div class="flex flex-col gap-2 items-end"><div class="flex items-center gap-2">${ex.video ? `<button onclick="actions.openVideo('${ex.video}')" class="p-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl shadow-lg active:scale-95 touch-manipulation transition-transform"><i data-lucide="play" class="w-4 h-4 fill-current"></i></button>` : ''}<button onclick="actions.openHistory('${ex.id}')" class="p-2 bg-slate-100 dark:bg-slate-800 text-slate-400 hover:text-indigo-600 dark:hover:text-white rounded-xl active:scale-95"><i data-lucide="list" class="w-4 h-4"></i></button></div></div>` : ''}${isEditor ? (isEditingEx ? `<div class="flex gap-2"><button onclick="actions.saveExercise()" class="p-2 md:p-3 bg-emerald-600 text-white rounded-xl active:scale-95 transition-transform"><i data-lucide="save" class="w-5 h-5"></i></button><button onclick="actions.cancelEditExercise()" class="p-2 md:p-3 bg-slate-200 dark:bg-slate-800 text-slate-900 dark:text-white rounded-xl hover:bg-slate-300 dark:hover:bg-slate-700 active:scale-95 transition-transform"><i data-lucide="x" class="w-5 h-5"></i></button></div>` : `<div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-950/50 p-1 md:p-1.5 rounded-2xl border border-slate-200 dark:border-slate-800">${ex.video ? `<div class="flex"><button onclick="actions.openVideo('${ex.video}')" class="p-2 md:p-2 text-emerald-600 dark:text-emerald-400 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-lg active:scale-95 transition-transform"><i data-lucide="play" class="w-5 h-5"></i></button><button onclick="actions.deleteVideo('${ex.id}')" class="p-2 md:p-2 text-slate-500 hover:text-red-400 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-lg active:scale-95 transition-transform"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>` : `<label class="p-2 md:p-2 text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-slate-800 rounded-lg cursor-pointer active:scale-95 transition-transform"><i data-lucide="upload" class="w-5 h-5"></i><input type="file" class="hidden" accept="video/*" onchange="actions.handleFileUpload(this, '${ex.id}')" /></label>`}<div class="w-px h-6 bg-slate-300 dark:bg-slate-800 mx-1"></div><button onclick="actions.startEditExercise('${ex.id}', '${ex.name}', '${ex.reps}')" class="p-2 md:p-2 text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-slate-800 rounded-lg active:scale-95 transition-transform"><i data-lucide="edit-2" class="w-5 h-5"></i></button><button onclick="actions.deleteExercise('${ex.id}')" class="p-2 md:p-2 text-slate-400 hover:text-red-500 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-lg active:scale-95 transition-transform"><i data-lucide="trash-2" class="w-5 h-5"></i></button></div>`) : ''}</div></div>${!isEditor ? `<div class="bg-slate-50 dark:bg-slate-950/50 border-t border-slate-200 dark:border-slate-800/50 p-3 md:p-4 flex items-center gap-2"><div class="flex-1 flex gap-2"><input id="weight-${ex.id}" type="number" placeholder="Peso" class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500" /><input id="reps-${ex.id}" type="number" placeholder="Reps" class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500" /></div><button onclick="actions.saveSet('${ex.id}')" class="p-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg active:scale-95 transition-transform"><i data-lucide="check" class="w-5 h-5"></i></button></div>` : ''}</div>`;
                }).join('')}${isEditor ? `<button onclick="actions.addNewExercise()" class="w-full py-5 md:py-6 border-2 border-dashed border-slate-300 dark:border-slate-800 hover:border-emerald-500/50 hover:bg-emerald-50 dark:hover:bg-emerald-500/5 rounded-3xl text-slate-500 hover:text-emerald-500 dark:hover:text-emerald-400 transition-all flex items-center justify-center gap-2 active:scale-[0.99] touch-manipulation"><i data-lucide="plus-circle" class="w-6 h-6"></i><span class="font-bold uppercase tracking-widest text-xs">Añadir Ejercicio</span></button>` : ''}</div>`;

            const toolbar = isEditor ? `<div class="flex flex-col gap-4 mb-2 fade-in"><div class="flex items-center justify-between"><button onclick="actions.setView('routines')" class="self-start flex items-center gap-2 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white pl-2 py-2 transition-colors"><i data-lucide="arrow-left" class="w-4 h-4"></i> Volver</button><button onclick="actions.deleteRoutine('${displayRoutine.id}')" class="flex items-center gap-2 px-3 py-2 text-xs font-bold text-red-500 bg-red-500/10 hover:bg-red-500/20 rounded-lg border border-red-500/20 active:scale-95 transition-transform"><i data-lucide="trash-2" class="w-3 h-3"></i> Eliminar</button></div><div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 flex items-center justify-between gap-4 shadow-sm">${state.isEditingRoutineName ? `<div class="flex-1 flex gap-2"><input type="text" value="${state.routineNameEdit}" oninput="actions.handleRoutineNameChange(this.value)" class="flex-1 bg-slate-50 dark:bg-slate-950 border border-emerald-500 rounded-lg px-3 py-2 text-slate-900 dark:text-white focus:outline-none text-sm md:text-base" autofocus /><button onclick="actions.saveRoutineName()" class="p-2 bg-emerald-600 rounded-lg text-white active:scale-95 transition-transform"><i data-lucide="save" class="w-4 h-4"></i></button></div>` : `<div class="flex-1 flex items-center gap-2 overflow-hidden"><h2 class="text-lg font-bold text-slate-900 dark:text-white truncate">${displayRoutine.name}</h2><button onclick="actions.toggleRoutineNameEdit(true)" class="text-slate-400 hover:text-emerald-500 p-2"><i data-lucide="edit-2" class="w-4 h-4"></i></button></div>`}</div></div>` : '';

            return `<div class="fade-in">${toolbar}${daySelector}${dayHeader}${exercisesList}</div>`;
        }

        function renderHeaderOnly() {
            const headerContainer = document.querySelector('header');
            if (headerContainer && headerContainer.parentElement) {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = Header();
                headerContainer.innerHTML = tempDiv.firstElementChild.innerHTML;
                lucide.createIcons();
            }
        }

        function render() {
            const appDiv = document.getElementById('app');
            if (state.isLoading) {
                appDiv.innerHTML = `<div class="min-h-[60vh] flex flex-col items-center justify-center text-slate-500 gap-4 fade-in"><i data-lucide="loader-2" class="w-12 h-12 animate-spin text-indigo-500"></i><p class="animate-pulse font-mono uppercase tracking-widest text-xs">Cargando...</p></div>`;
            } else {
                const isRoutineView = state.currentView === 'home' || (state.currentView === 'routines' && state.editingRoutineId);
                appDiv.innerHTML = `<header class="mb-6 md:mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4 fade-in">${Header()}</header><main>${isRoutineView ? RoutineDetail() : RoutineList()}</main>${BottomNav()}`;
            }
            lucide.createIcons();
            renderModal();
        }

        function renderModal() {
            const modal = document.getElementById('modal-layer');
            if (state.isModalOpen) {
                modal.classList.remove('hidden');
                modal.classList.add('fade-in');
                let content = '';
                
                if (state.modalType === 'video') {
                     content = `<div class="aspect-video w-full bg-black relative flex items-center justify-center"><video src="${state.activeVideo}" controls autoplay loop class="w-full h-full object-contain"></video></div>`;
                } else if (state.modalType === 'history') {
                    const r = getDisplayRoutine();
                    const ex = r.days[state.selectedDay].exercises.find(e => e.id === state.activeHistoryExerciseId);
                    const history = ex && ex.history ? [...ex.history].reverse() : [];
                    content = `<div class="bg-white dark:bg-slate-900 w-full max-h-[70vh] flex flex-col"><div class="p-6 border-b border-slate-200 dark:border-slate-800"><h3 class="text-xl font-bold text-slate-900 dark:text-white">${ex ? ex.name : 'Historial'}</h3><p class="text-slate-500 text-sm">Registro de progreso</p></div><div class="p-6 overflow-y-auto space-y-3">${history.length === 0 ? '<p class="text-center text-slate-500">Aún no hay registros.</p>' : history.map(log => `<div class="flex justify-between items-center p-3 bg-slate-50 dark:bg-slate-950 rounded-xl border border-slate-200 dark:border-slate-800"><span class="text-slate-500 dark:text-slate-400 text-xs">${new Date(log.date).toLocaleDateString()}</span><span class="text-slate-900 dark:text-white font-bold font-mono">${log.weight}kg x ${log.reps}</span></div>`).join('')}</div></div>`;
                } else if (state.modalType === 'confirm') {
                    // --- MODAL DE CONFIRMACIÓN ---
                    content = `
                        <div class="bg-white dark:bg-slate-900 w-full p-6 text-center">
                            <div class="mb-4 text-red-500 bg-red-100 dark:bg-red-900/30 p-4 rounded-full w-16 h-16 mx-auto flex items-center justify-center">
                                <i data-lucide="alert-triangle" class="w-8 h-8"></i>
                            </div>
                            <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-2">¿Estás seguro?</h3>
                            <p class="text-slate-500 mb-6">${state.modalMessage}</p>
                            <div class="flex gap-3">
                                <button onclick="actions.closeModal()" class="flex-1 py-3 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-xl font-bold">Cancelar</button>
                                <button onclick="actions.confirmAction()" class="flex-1 py-3 bg-red-600 text-white rounded-xl font-bold hover:bg-red-700">Eliminar</button>
                            </div>
                        </div>
                    `;
                } else if (state.modalType === 'alert') {
                    // --- MODAL DE ALERTA SIMPLE ---
                    content = `
                        <div class="bg-white dark:bg-slate-900 w-full p-6 text-center">
                            <div class="mb-4 text-indigo-500 bg-indigo-100 dark:bg-indigo-900/30 p-4 rounded-full w-16 h-16 mx-auto flex items-center justify-center">
                                <i data-lucide="info" class="w-8 h-8"></i>
                            </div>
                            <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-2">Atención</h3>
                            <p class="text-slate-500 mb-6">${state.modalMessage}</p>
                            <button onclick="actions.closeModal()" class="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold">Entendido</button>
                        </div>
                    `;
                }

                modal.innerHTML = `
                    <div class="relative w-full max-w-sm md:max-w-4xl bg-white dark:bg-slate-900 rounded-[2.5rem] overflow-hidden shadow-2xl border border-slate-200 dark:border-slate-800 scale-in">
                        ${state.modalType !== 'confirm' && state.modalType !== 'alert' ? 
                        `<button onclick="actions.closeModal()" class="absolute top-4 right-4 z-20 h-10 w-10 bg-white/80 dark:bg-slate-950/80 hover:bg-red-600 dark:hover:bg-red-600 text-slate-900 dark:text-white hover:text-white rounded-2xl flex items-center justify-center transition-all"><i data-lucide="x" class="w-6 h-6"></i></button>` : ''}
                        ${content}
                    </div>
                `;
                lucide.createIcons();
            } else {
                modal.classList.add('hidden');
                modal.classList.remove('fade-in');
                modal.innerHTML = '';
            }
        }

        initApp();
    </script>
</body>
</html>
